name: "Terraform Experiment"

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  AWS_REGION: us-west-2

jobs:
  plan:
    name: "Terraform Plan & Review"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=infrastructure init

      # 1. Generate a plan file
      - name: Terraform Plan
        run: terraform -chdir=infrastructure plan -out=tfplan

      # 2. Convert the plan to JSON (Terracotta and other tools require JSON format)
      - name: Export Plan to JSON
        run: terraform -chdir=infrastructure show -json tfplan > infrastructure/tfplan.json

      # 3. Run Terracotta AI Review
      - name: Terracotta AI API Review
        env:
          TERRACOTTA_API_KEY: ${{ secrets.TERRACOTTA_API_KEY }}
        run: |
          # 1. Wrap the terraform plan into the expected "plan" key
          jq -n --argjson p "$(cat infrastructure/tfplan.json)" '{plan: $p}' > infrastructure/payload.json

          # 2. POST the wrapped payload to the review endpoint
          RESPONSE=$(curl -s -X POST "https://api.tryterracotta.com/v1/tc/review" \
            -H "x-api-key: $TERRACOTTA_API_KEY" \
            -H "Content-Type: application/json" \
            -d @infrastructure/payload.json)

          echo "Terracotta Response: $RESPONSE"

          # 3. Check for high-risk findings (using jq to parse the actual report data)
          # Note: The 'review' endpoint often returns findings in an array
          RISK_COUNT=$(echo $RESPONSE | jq '[.data.findings[] | select(.severity == "high")] | length')

          if [ "$RISK_COUNT" -gt 0 ]; then
            echo "❌ FAILED: Found $RISK_COUNT high-severity issues."
            exit 1
          else
            echo "✅ PASSED: No high-severity issues found."
          fi

  apply:
    name: "Terraform Apply"
    needs: plan             # Ensures Apply only starts after Plan finishes
    runs-on: ubuntu-latest
    environment: Production  # This triggers the manual approval gate
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=infrastructure init

      - name: Terraform Apply
        run: terraform -chdir=infrastructure apply -auto-approve